<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Report — All Students</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            padding: 20px;
        }

        /* --- Fixed toolbar (hidden in print) --- */
        .toolbar {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }

        .toolbar button,
        .toolbar a {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .btn-print {
            background: #007bff;
        }

        .btn-print:hover {
            background: #0056b3;
        }

        .btn-back {
            background: #6c757d;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        /* --- Each report card page --- */
        .report-page {
            width: 210mm;
            /* A4 width */
            min-height: 297mm;
            /* A4 height */
            margin: 0 auto 25px auto;
            background: #fff;
            padding: 12mm 10mm;
            page-break-after: always;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .1);
            position: relative;
        }

        .report-page:last-child {
            page-break-after: auto;
        }

        /* --- Same styles as report_card.html --- */
        .report-card {
            background: white;
            border: 6px solid #000;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #000;
            margin-bottom: 10px;
        }

        .logo {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .school-info {
            flex: 1;
            padding-left: 15px;
        }

        .school-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .school-details {
            font-size: 14px;
            line-height: 1.4;
        }

        .exam-info {
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-info .session {
            font-size: 14px;
            font-weight: bold;
        }

        .exam-title {
            background: #e9ecef;
            border: 1px solid #000;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .student-info {
            display: flex;
            margin-bottom: 10px;
            align-items: center;
            gap: 10px;
        }

        .student-details {
            flex: 1;
            border: 1px solid #000;
            border-radius: 10px;
            padding: 12px;
        }

        .student-details table {
            width: 100%;
        }

        .student-details td {
            padding: 2px 0;
            font-size: 13px;
        }

        .student-details td:nth-child(1),
        .student-details td:nth-child(4) {
            font-weight: bold;
        }

        .student-details td:nth-child(4) {
            padding-left: 40px;
        }

        .student-avatar img {
            width: 90px;
            height: auto;
        }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .grades-table th,
        .grades-table td {
            border: 1px solid #000;
            padding: 3px;
            text-align: center;
            font-size: 11px;
        }

        .grades-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .summary-section {
            display: flex;
            margin-bottom: 15px;
            gap: 15px;
        }

        .summary-table {
            border-collapse: collapse;
            flex: 1;
        }

        .summary-table td {
            font-size: 13px;
            border: 1px solid #000;
            padding: 4px 5px;
            font-weight: bold;
            text-align: center;
        }

        .bottom-section {
            display: flex;
            align-items: stretch;
            gap: 15px;
            margin-bottom: 50px;
        }

        .teacher-remarks {
            flex: 1;
        }

        .remarks-box {
            border: 1px solid #000;
            height: 140px;
            padding: 8px;
            background: #f8f9fa;
        }

        .chart-section {
            flex: 1;
        }

        .chart-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .chart {
            display: flex;
            align-items: end;
            height: 140px;
            gap: 12px;
            padding: 15px;
            border: 1px solid #000;
        }

        .bar {
            flex: 1;
            background: #060078;
            min-height: 15px;
            position: relative;
        }

        .bar-label {
            position: absolute;
            bottom: -42px;
            left: 50%;
            transform: translateX(-60%) rotate(-60deg) scale(0.85);
            white-space: nowrap;
            font-size: 9px;
        }

        .bar-value {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            white-space: nowrap;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .signature {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .signature-line {
            width: 170px;
            border-bottom: 2px solid #000;
            margin-bottom: 5px;
            height: 15px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #555;
        }

        /* --- PRINT RULES --- */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .toolbar {
                display: none !important;
            }

            .report-page {
                width: 100%;
                min-height: 100vh;
                margin: 0;
                padding: 10mm;
                box-shadow: none;
                page-break-after: always;
            }

            .report-page:last-child {
                page-break-after: auto;
            }

            .bar {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background: #060078 !important;
            }

            .grades-table th,
            .grades-table tr:nth-child(even) {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background: #f8f9fa !important;
            }

            .grades-table,
            .summary-section,
            .signatures {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <a href="bulk_print.html" class="btn-back">← Back</a>
        <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>
    </div>

    <div id="pagesContainer">
        <div class="loading">Loading report cards…</div>
    </div>

    <script>
        // ============ AUTH CHECK ============
        (function () {
            let valid = false;
            try {
                const auth = JSON.parse(localStorage.getItem('auth') || '{}');
                valid = auth.ok && Date.now() < auth.exp;
            } catch (e) { valid = false; }
            if (!valid && localStorage.getItem('isLoggedIn') === 'true') valid = true;
            if (!valid) window.location.href = 'login.html';
        })();

        // ============ HELPERS ============
        const PASS_MARK = 40;

        function calculateGrade(p) {
            if (p >= 90) return 'A+';
            if (p >= 80) return 'A';
            if (p >= 70) return 'B';
            if (p >= 60) return 'C';
            if (p >= 50) return 'D';
            if (p >= 40) return 'E';
            return 'F';
        }

        function calculateStatus(p) { return p >= PASS_MARK ? 'Pass' : 'Fail'; }

        function safePercentage(obtained, total) {
            if (!Number.isFinite(obtained) || !Number.isFinite(total) || total <= 0) return 0;
            return Math.min((obtained / total) * 100, 100);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ============ LOAD SELECTION ============
        let students = [];
        try {
            students = JSON.parse(localStorage.getItem('bulkSelection') || '[]');
        } catch (e) { students = []; }

        const pagesContainer = document.getElementById('pagesContainer');

        if (students.length === 0) {
            pagesContainer.innerHTML = `
                <div class="loading">
                    No students selected.<br><br>
                    <a href="bulk_print.html" style="color:#007bff;">← Go back and select students</a>
                </div>`;
        } else {
            pagesContainer.innerHTML = '';
            students.forEach((student, idx) => {
                pagesContainer.appendChild(buildReportPage(student, idx));
            });
        }

        // ============ BUILD ONE PAGE ============
        function buildReportPage(st, idx) {
            const page = document.createElement('div');
            page.className = 'report-page';

            // Compute
            let totalObtained = 0, totalMax = 0;
            const subjects = st.subjects || [];
            const percentages = [], grades = [], statuses = [];

            subjects.forEach(s => {
                const pct = safePercentage(s.obtained, s.total);
                percentages.push(pct);
                grades.push(calculateGrade(pct));
                statuses.push(calculateStatus(pct));
                totalObtained += s.obtained || 0;
                totalMax += s.total || 0;
            });

            const overallPct = safePercentage(totalObtained, totalMax);
            const overallGrade = calculateGrade(overallPct);
            const overallStatus = calculateStatus(overallPct);

            const showPct = st.showPercentage !== false;
            const showGr = st.showGrade !== false;
            const showSt = st.showStatus !== false;

            const examTitle = st.term ? `${escapeHtml(st.term)} Term Exam` : 'Exam';
            const sessionTxt = `Session: ${st.year}-${st.year + 1}`;

            // Build rows
            let rowsHtml = '';
            subjects.forEach((s, i) => {
                rowsHtml += '<tr>' +
                    `<td>${i + 1}</td>` +
                    `<td>${escapeHtml(s.subject)}</td>` +
                    `<td>${s.total}</td>` +
                    `<td>${s.obtained}</td>`;
                if (showPct) rowsHtml += `<td>${percentages[i].toFixed(1)}%</td>`;
                if (showGr) rowsHtml += `<td>${grades[i]}</td>`;
                if (showSt) rowsHtml += `<td>${statuses[i]}</td>`;
                rowsHtml += '</tr>';
            });

            // Chart bars
            let barsHtml = '';
            subjects.forEach((s, i) => {
                const h = Math.max(5, Math.min(percentages[i], 100));
                barsHtml += `
                    <div class="bar" style="height:${h}%;">
                        <div class="bar-value">${percentages[i].toFixed(1)}%</div>
                        <div class="bar-label">${escapeHtml(s.subject)}</div>
                    </div>`;
            });

            // Headers conditional
            let headerHtml = `<th>S#</th><th>Subjects</th><th>Total Marks</th><th>Obt Marks</th>`;
            if (showPct) headerHtml += '<th>Per%</th>';
            if (showGr) headerHtml += '<th>Grade</th>';
            if (showSt) headerHtml += '<th>Status</th>';

            let summaryHeaders = `<td>Total</td><td>Obtained</td>`;
            let summaryValues = `<td>${totalMax}</td><td>${totalObtained}</td>`;
            if (showPct) { summaryHeaders += '<td>Percentage</td>'; summaryValues += `<td>${overallPct.toFixed(1)}%</td>`; }
            if (showGr) { summaryHeaders += '<td>Grade</td>'; summaryValues += `<td>${overallGrade}</td>`; }
            if (showSt) { summaryHeaders += '<td>Status</td>'; summaryValues += `<td>${overallStatus}</td>`; }

            page.innerHTML = `
                <div class="report-card">
                    <div class="header">
                        <div class="logo"><img src="./img/logo.jpg" alt="" onerror="this.style.display='none'"></div>
                        <div class="school-info">
                            <div class="school-name">THE WISER SCHOOL SYSTEM &amp; ACADEMY</div>
                            <div class="school-details">
                                Lala Zar Colony Bara Dari Road Shahdara Lahore PH: 0320-9514171
                            </div>
                        </div>
                    </div>

                    <div class="exam-info">
                        <div class="exam-title">${examTitle}</div>
                        <div class="session">${sessionTxt}</div>
                    </div>

                    <div class="student-info">
                        <div class="student-details">
                            <table>
                                <tr>
                                    <td>Class</td><td>:</td><td>${escapeHtml(st.class)}</td>
                                    <td>Student Name</td><td>:</td><td>${escapeHtml(st.name)}</td>
                                </tr>
                                <tr>
                                    <td>Father Name</td><td>:</td><td>${escapeHtml(st.fatherName)}</td>
                                    <td>Position</td><td>:</td><td></td>
                                </tr>
                            </table>
                        </div>
                        <div class="student-avatar">
                            <img src="./img/student.webp" alt="" onerror="this.style.display='none'">
                        </div>
                    </div>

                    <table class="grades-table">
                        <thead><tr>${headerHtml}</tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>

                    <div class="summary-section">
                        <table class="summary-table">
                            <tr>${summaryHeaders}</tr>
                            <tr>${summaryValues}</tr>
                        </table>
                    </div>

                    <div class="bottom-section">
                        <div class="teacher-remarks">
                            <div class="chart-title">Teacher Remarks</div>
                            <div class="remarks-box"></div>
                        </div>
                        <div class="chart-section">
                            <div class="chart-title">Subject Performance</div>
                            <div class="chart">${barsHtml}</div>
                        </div>
                    </div>

                    <div class="signatures">
                        <div class="signature">
                            <div class="signature-line"></div>
                            <div>Principal Signature</div>
                        </div>
                        <div class="signature">
                            <div class="signature-line"></div>
                            <div>Vice Principal Signature</div>
                        </div>
                    </div>
                </div>
            `;

            return page;
        }
    </script>
</body>

</html>
