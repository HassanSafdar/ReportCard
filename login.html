<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Result Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #007bff, #00c6ff);
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-logo {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: 500;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #95a5a6;
            font-size: 13px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #007bff, #00c6ff);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            -webkit-appearance: none;
            appearance: none;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #0056b3, #0099ff);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            background: #fde8e8;
            display: none;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 20px;
                max-width: 100%;
                margin: 0 10px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .login-logo {
                width: 80px;
            }

            .form-group input {
                font-size: 16px;
                padding: 12px;
            }

            .login-btn {
                padding: 12px;
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 15px;
            }

            .login-header h1 {
                font-size: 18px;
            }

            .login-logo {
                width: 70px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 15px;
            }

            .login-header {
                margin-bottom: 10px;
            }

            .login-logo {
                width: 60px;
                margin-bottom: 5px;
            }

            .form-group {
                margin-bottom: 10px;
            }
        }

        @supports (-webkit-touch-callout: none) {

            input[type="text"],
            input[type="password"] {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <img src="./img/logo.jpg" alt="School Logo" class="login-logo" onerror="this.style.display='none'">
            <h1>Result Management System</h1>
            <p>Welcome back! Please login to your account</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username"
                    autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i> Invalid username or password
            </div>
        </form>
    </div>

    <script>
        // ============ CONFIG ============
        // Replace this hash with SHA-256 of YOUR password.
        // Generate at: https://emn178.github.io/online-tools/sha256.html
        const USER_NAME = 'wiser';
        const PASS_HASH = 'e57f9b17e992cf20ecf0e06c5ac205f42052558718362e76e44b0c3b570717da';

        // Session length: 8 hours
        const SESSION_MS = 8 * 60 * 60 * 1000;

        // If already logged in and session is valid, skip to index
        (function checkExisting() {
            try {
                const auth = JSON.parse(localStorage.getItem('auth') || '{}');
                if (auth.ok && Date.now() < auth.exp) {
                    window.location.href = 'index.html';
                }
            } catch (e) { /* ignore */ }
        })();

        // Show/hide password
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwd = document.getElementById('password');
            const isPwd = pwd.type === 'password';
            pwd.type = isPwd ? 'text' : 'password';
            this.classList.toggle('fa-eye', !isPwd);
            this.classList.toggle('fa-eye-slash', isPwd);
        });

        // SHA-256 helper
        async function sha256(str) {
            if (!window.crypto || !window.crypto.subtle) {
                // Fallback for non-HTTPS / old browsers
                return fallbackSha256(str);
            }
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Tiny fallback (won't be used on HTTPS) — just returns the raw string
        // so that you don't get a hard crash. Replace PASS_HASH logic accordingly if needed.
        function fallbackSha256(s) {
            console.warn('crypto.subtle unavailable — using insecure fallback');
            return s;
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('error-message');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errBox.style.display = 'none';

            try {
                const hash = await sha256(password);
                const ok = (username === USER_NAME) && (hash === PASS_HASH);

                if (ok) {
                    localStorage.setItem('auth', JSON.stringify({
                        ok: true,
                        exp: Date.now() + SESSION_MS
                    }));
                    localStorage.setItem('isLoggedIn', 'true'); // kept for compatibility
                    window.location.href = 'index.html';
                } else {
                    errBox.style.display = 'block';
                    setTimeout(() => { errBox.style.display = 'none'; }, 3000);
                }
            } catch (err) {
                console.error(err);
                errBox.textContent = 'An error occurred. Please try again.';
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
